name: fork-browser

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fork-setup-bun
      - run: bun node_modules/playwright-core/cli.js install --with-deps chromium
      # Ubuntu restricts unprivileged user namespaces for downloaded Chromium builds.
      # Allow only this installed executable to create its sandbox, as Chromium recommends.
      - name: Allow Chromium sandbox namespaces
        run: |
          browser="$(bun -e 'import { chromium } from "playwright-core"; console.log(chromium.executablePath())')"
          cat <<EOF | sudo tee /etc/apparmor.d/opencyber-chromium
          abi <abi/4.0>,
          include <tunables/global>
          profile opencyber-chromium "$browser" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser --replace /etc/apparmor.d/opencyber-chromium
      - name: Test real Chromium and a compiled capture client
        run: |
          export OPENCYBER_TEST_BROWSER="$(bun -e 'import { chromium } from "playwright-core"; console.log(chromium.executablePath())')"
          bun test test/plugin/fork-cyber-browser.test.ts
          bun build --compile --format=esm --minify --bytecode --external 'chromium-bidi/*' test/fixture/fork-cyber-browser-smoke.ts --outfile /tmp/opencyber-browser-smoke
          /tmp/opencyber-browser-smoke
