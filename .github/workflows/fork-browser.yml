name: fork-browser

on:
  pull_request:
    branches: [custom]
    paths:
      - packages/core/src/fork-cyber/**
      - packages/core/src/plugin/fork-cyber.ts
      - packages/core/test/plugin/fork-cyber-browser.test.ts
      - packages/core/test/fixture/fork-cyber-browser-smoke.ts
      - packages/core/package.json
      - packages/cli/script/build.ts
      - .github/workflows/fork-browser.yml
      - bun.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fork-setup-bun
      - run: bun node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Test real Chromium and a compiled capture client
        run: |
          export OPENCYBER_TEST_BROWSER="$(bun -e 'import { chromium } from "playwright-core"; console.log(chromium.executablePath())')"
          bun test test/plugin/fork-cyber-browser.test.ts
          bun build --compile --format=esm --minify --bytecode --external 'chromium-bidi/*' test/fixture/fork-cyber-browser-smoke.ts --outfile /tmp/opencyber-browser-smoke
          /tmp/opencyber-browser-smoke
