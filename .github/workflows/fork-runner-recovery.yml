name: fork-runner-recovery

on:
  workflow_run:
    workflows: [fork-release, fork-sync]
    branches: [custom]
    types: [completed]
  # The completion listener can also miss a runner during an Actions outage.
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: fork-runner-recovery
  cancel-in-progress: false

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  recover:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout or artifacts: the write token only runs this trusted inline script.
      - name: Recover runs that never acquired a runner
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const repo = context.repo;
            const branch = await github.rest.repos.getBranch({ ...repo, branch: "custom" });
            for (const workflow_id of ["fork-release.yml", "fork-sync.yml"]) {
              // Only the newest run matters. A newer success or active run supersedes failures.
              const listed = await github.rest.actions.listWorkflowRuns({ ...repo, workflow_id, branch: "custom", per_page: 1 });
              const latest = listed.data.workflow_runs[0];
              if (!latest) continue;
              const run = (await github.rest.actions.getWorkflowRun({ ...repo, run_id: latest.id })).data;
              if (run.status !== "completed" || run.conclusion !== "failure" || run.head_sha !== branch.data.commit.sha) continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                ...repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100
              });
              // Preserve successful jobs. Retry only runner failures before any step executed.
              const cancelled = jobs.filter(job => !["success", "skipped"].includes(job.conclusion));
              if (cancelled.some(job => job.conclusion !== "cancelled" || job.steps.length)) continue;
              if (!cancelled.length) continue;
              const annotations = await Promise.all(cancelled.map(job => github.paginate(github.rest.checks.listAnnotations, {
                ...repo, check_run_id: Number(new URL(job.check_run_url).pathname.split("/").pop()), per_page: 100
              })));
              if (!annotations.every(items => items.some(item => item.annotation_level === "failure" &&
                item.message === "The job was not acquired by Runner of type hosted even after multiple attempts"))) continue;
              if (run.run_attempt >= 3) {
                core.warning(`Runner recovery exhausted for ${run.html_url}; inspect GitHub Actions status and rerun manually.`);
                continue;
              }
              await github.rest.actions.reRunWorkflowFailedJobs({ ...repo, run_id: run.id });
              core.notice(`Requested recovery for ${run.html_url}: attempt ${run.run_attempt + 1}/3 on the same commit.`);
            }
