name: Bug report
description: Report a reproducible issue in OpenCyber
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened and what you expected instead.
      placeholder: What happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OpenCyber version
      description: Output of `opencyber --version`, for example `2.4.1 (Cyber)`.
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Release installer
        - Built from source
        - Other
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem. Include the target type (web app, API, local project) but remove credentials and client data.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste the relevant lines with secrets and target data removed.
      render: text
    validations:
      required: false

  - type: input
    id: plugins
    attributes:
      label: Plugins
      description: What plugins, MCP servers or custom agents are enabled?
    validations:
      required: false

  - type: textarea
    id: screenshot-or-link
    attributes:
      label: Screenshot
      description: Attach a screenshot or recording if the problem is visual.
      placeholder: Drag and drop screenshot here
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you using?
      placeholder: e.g., Ubuntu 24.04, Windows 11
    validations:
      required: false

  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: What terminal are you using?
      placeholder: e.g., Ghostty, Alacritty, Windows Terminal
    validations:
      required: false
